# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GREETING: Hello, world!

tasks:
  default:
    desc: Execute on file changes
    watch: true
    sources:
      - "**/*.py"
    cmds:
      - "uv run src/warden/cli.py --verbose test -r docs/rule-test/rule.yml -f docs/rule-test/file.txt"
    silent: true

  test:
    desc: Run tests
    cmds:
      - echo "Running tests..."
      - uv run pytest

  test-rules:
    desc: Run rule tests
    cmds:
      - echo "Running rule tests..."
      #- uv run pytest tests/rules.test.py -v -s 2>&1
      - uv run python tests/rules.py

  build:
    desc: Build standalone binary with PyInstaller
    cmds:
      - echo "Building standalone binary..."
      - >-
        uv run --group build pyinstaller src/warden/cli.py
        --onefile
        --name warden
        --paths src
        --additional-hooks-dir packaging/macos/hooks
        --clean
        --noconfirm
      - echo "Build complete. Output at dist/warden"
