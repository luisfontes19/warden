# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:

  default:
    desc: Execute on file changes
    cmds:
      - task bundle
      - task dev

  cli:
    cmds:
      - "uv run src/warden/cli.py {{.CLI_ARGS}}"

  dev:
    desc: Watch for file changes and execute a command
    watch: true
    sources:
      - "**/*.py"
    cmds:
      - task cli
    silent: true

  run-rule:
    desc: Run a specific rule test
    cmds:
      - task cli --  --verbose test -r docs/rule-test/rule.yml -f
        docs/rule-test/file.txt

  bundle:
    desc: Create a rules bundle
    cmds:
      - task cli -- bundle create --rules-folder data/rules-bundle --output
        data/bundle.zip

  servers:docs:
    desc: Start documentation server
    cmds:

      - uv run --group docs mkdocs serve -w docs

  servers:mdm:
    desc: Start server for MDM testing
    cmds:

      - "mkdir -p /etc/warden && cp ./data/policies/linux.json
        /etc/warden/policy.json"
      - python3 -m http.server 5555 --directory ./data

  test:
    desc: Run all tests
    cmds:
      - task: test:unit
      - task: test:rules

  test:unit:
    desc: Run tests
    cmds:
      - echo "Running tests..."
      - uv run pytest

  test:rules:
    desc: Run rule tests
    cmds:
      - echo "Running rule tests..."
      #- uv run pytest tests/rules.test.py -v -s 2>&1
      - uv run python tests/rules.py

  docs:
    desc: Serve documentation site locally
    cmds:
      - uv run --group docs mkdocs serve -w docs

  build:
    desc: Build standalone binary with PyInstaller
    cmds:
      - echo "Building standalone binary..."
      - >-
        uv run --group build pyinstaller src/warden/cli.py --onefile --name
        warden --paths src --additional-hooks-dir packaging/macos/hooks --clean
        --noconfirm
      - echo "Build complete. Output at dist/warden"
