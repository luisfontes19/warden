version: 1
rules:
  - id: notify-on-forbidden-word
    description: Sends a request when a forbidden word is found
    file:
      - docs/rule-test/file.txt
    filetype: "text"
    patterns:
      - contains: "asd"
    actions:
      - request:
          url: "https://warden-tests.requestcatcher.com"
          method: POST
          headers:
            Content-Type: application/json
            X-Rule-Id: "${{rule_id}}"
          body:
            rule: "${{rule_id}}"
            file: "${{file}}"
            matched: "${{matched_content}}"
            description: "${{description}}"
            first_match_file: "${{matches[0].file}}"
            all_matches: "${{json(matches)}}"
