name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build binary
        run: >-
          uv run --group build pyinstaller src/warden/cli.py --onefile --name
          warden --paths src --additional-hooks-dir packaging/hooks --clean
          --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: warden-${{ runner.os }}
          path: dist/warden*

      - name: Build macOS package
        if: runner.os == 'macOS'
        run: |
          VERSION=$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('Warden'))")

          # Build payload layout: files mirror their final install paths
          mkdir -p pkg-payload/usr/local/bin
          mkdir -p pkg-payload/Library/LaunchDaemons

          cp dist/warden pkg-payload/usr/local/bin/warden
          cp packaging/macos/io.github.luisfontes19.warden.plist pkg-payload/Library/LaunchDaemons/io.github.luisfontes19.warden.plist

          # Make scripts executable
          chmod +x packaging/macos/scripts/preinstall
          chmod +x packaging/macos/scripts/postinstall

          pkgbuild \
            --root pkg-payload \
            --scripts packaging/macos/scripts \
            --identifier io.github.luisfontes19.warden \
            --version "$VERSION" \
            --install-location / \
            dist/warden-$VERSION.pkg

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: warden-macOS-pkg
          path: dist/warden-*.pkg

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: warden-macOS-mobileconfig
          path: packaging/macos/warden.mobileconfig
