[project]
name = "Warden"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=44.0.0",
    "jinja2>=3.1.6",
    "jq>=1.6",
    "pyyaml>=6.0",
    "requests>=2.33.1",
    "watchdog>=6.0",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/Warden"]

[dependency-groups]
dev = [
 "pytest>=9.0.3",
 "ruff>=0.9",
]
build = ["pyinstaller>=6.0"]
docs = [
    "mkdocs-material>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "*.test.py"]
addopts = "--import-mode=importlib"

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonPath = "src"
